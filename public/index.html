<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finance Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">PERSONAL LEDGER</p>
        <h1>My Finances</h1>
      </div>
      <time class="today-label" id="todayLabel"></time>
    </header>

    <section class="summary-grid" id="summaryGrid">
      <div class="summary-card" data-period="week">
        <span class="label">Week</span>
        <span class="net" id="week-net">—</span>
        <span class="breakdown"><span id="week-income">0</span> in / <span id="week-expense">0</span> out</span>
      </div>
      <div class="summary-card" data-period="month">
        <span class="label">Month</span>
        <span class="net" id="month-net">—</span>
        <span class="breakdown"><span id="month-income">0</span> in / <span id="month-expense">0</span> out</span>
      </div>
      <div class="summary-card" data-period="year">
        <span class="label">Year</span>
        <span class="net" id="year-net">—</span>
        <span class="breakdown"><span id="year-income">0</span> in / <span id="year-expense">0</span> out</span>
      </div>
    </section>

    <section class="add-form">
      <div class="form-heading">
        <h2>New entry</h2>
        <span>INCOME / EXPENSE</span>
      </div>
      <div class="type-toggle" role="group" aria-label="Transaction type">
        <button type="button" class="type-btn active" data-type="INCOME" aria-pressed="true">Income</button>
        <button type="button" class="type-btn" data-type="EXPENSE" aria-pressed="false">Expense</button>
      </div>
      <form id="txForm">
        <label class="sr-only" for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Amount" inputmode="decimal" step="0.01" min="0.01" required />
        <label class="sr-only" for="reason">Reason</label>
        <input type="text" id="reason" placeholder="Reason (e.g. salary, groceries)" maxlength="200" required />
        <div class="quick-reasons" aria-label="Common reasons">
          <button type="button" class="reason-chip" data-reason="Groceries">Groceries</button>
          <button type="button" class="reason-chip" data-reason="Transport">Transport</button>
          <button type="button" class="reason-chip" data-reason="Bills">Bills</button>
          <button type="button" class="reason-chip" data-reason="Salary">Salary</button>
        </div>
        <button type="submit" id="submitBtn">Add Income</button>
      </form>
      <p class="error" id="formError" role="status" aria-live="polite"></p>
    </section>

    <section class="tx-list">
      <div class="activity-heading">
        <div>
          <h2>Activity</h2>
          <p id="txCount">Recent transactions</p>
        </div>
        <span class="period-label" id="periodLabel">All time</span>
      </div>
      <div class="filter-block">
        <div class="segmented period-filter" role="group" aria-label="Filter by date">
          <button type="button" data-period="today" aria-pressed="false">Today</button>
          <button type="button" data-period="week" aria-pressed="false">Week</button>
          <button type="button" data-period="month" aria-pressed="false">Month</button>
          <button type="button" class="selected" data-period="all" aria-pressed="true">All</button>
        </div>
        <div class="segmented type-filter" role="group" aria-label="Filter by transaction type">
          <button type="button" class="selected" data-filter-type="all" aria-pressed="true">All entries</button>
          <button type="button" data-filter-type="INCOME" aria-pressed="false">Income</button>
          <button type="button" data-filter-type="EXPENSE" aria-pressed="false">Expense</button>
        </div>
      </div>
      <div class="activity-summary" aria-live="polite">
        <span id="resultCount">0 entries</span>
        <span>Net <strong id="resultNet">—</strong></span>
      </div>
      <ul id="txList"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
